name: Nightly sim

# Two Gazebo suites, in parallel (project/scripts/sim_flight_test.sh, SUITE=...):
#   flight   drone_bringup/test/test_sim_flight.py: takeoff, hover, a square, the
#            speed limits, the mission dying mid-flight, landing
#   sensors  drone_bringup/test/test_sim_sensors.py: the simulated sensors and the
#            estimator against ground truth (hover, 4 m pass, two slow creeps)
# Too slow for every push (5-6 min each with the image), so: every night, from the
# Actions tab, and on PRs that change the sim itself. Not part of the block-red-pr
# check. Same as `make sim-test` and `make sim-test-sensors` on a laptop.

on:
  schedule:
    - cron: '0 2 * * *'         # every night at 02:00 UTC
  workflow_dispatch:            # "Run workflow" button in the Actions tab
  pull_request:
    paths:
      - 'project/ros2/src/drone_bringup/launch/**'
      - 'project/ros2/src/drone_bringup/config/**'
      - 'project/ros2/src/drone_bringup/worlds/**'
      - 'project/ros2/src/drone_bringup/test/test_sim_flight.py'
      - 'project/ros2/src/drone_bringup/test/test_sim_sensors.py'
      - 'project/ros2/src/drone_sim/**'
      - 'project/scripts/sim_flight_test.sh'
      - '.github/workflows/nightly.yml'

concurrency:                    # a new run cancels the older one on the same branch
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gazebo:
    name: gazebo-${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false          # one suite failing does not cancel the other
      matrix:
        suite: [flight, sensors]
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The image the team develops in, so the sim here is the sim on our laptops.
      # Layers come from the docker-image job's cache (ci.yml): usually 1-2 min.
      - name: Build the dev image
        uses: docker/build-push-action@v6
        with:
          context: project
          load: true
          tags: seame/ros2-dev:jazzy
          cache-from: type=gha

      - name: Fly in Gazebo (headless)
        env:
          SUITE: ${{ matrix.suite }}
        run: project/scripts/sim_flight_test.sh "$RUNNER_TEMP/sim_${{ matrix.suite }}"

      - name: Keep the results (log, xUnit, rosbag of the flight)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-${{ matrix.suite }}
          path: ${{ runner.temp }}/sim_${{ matrix.suite }}
          retention-days: 14
          if-no-files-found: ignore
