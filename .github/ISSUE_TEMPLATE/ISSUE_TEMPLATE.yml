name: Issue Template
description: File an issue to be tackled
title: "[TYPE OF ISSUE]: "
body:
  - type: markdown
    attributes:
      value: |
        Replace `[TYPE OF ISSUE]` in the title with the type, e.g. `[BUG]`, `[FEATURE]`, `[TASK]`.
  - type: textarea
    id: describe-the-issue
    attributes:
      label: What happened?
      description: Give enough context for someone else to pick this up.
      placeholder: Describe the issue...
    validations:
      required: true
  - type: textarea
    id: finished-state
    attributes:
      label: What is needed to be considered finished?
      placeholder: Describe
    validations:
      required: false
  - type: checkboxes
    id: documentation
    attributes:
      label: Documentation
      description: Does it need to update or create new documentation
      options:
        - label: This issue needs documentation
          required: false
