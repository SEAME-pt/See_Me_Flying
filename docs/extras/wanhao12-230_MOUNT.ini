# Wanhao Duplicator 12/230 - PLA - tuned for MOUNT.stl (plate with windows + U-channel slide mount)
# --- printer ---
bed_shape = 0x0,230x0,230x230,0x230
max_print_height = 250
gcode_flavor = marlin2
machine_limits_usage = time_estimate_only
nozzle_diameter = 0.4
use_relative_e_distances = 0
use_firmware_retraction = 0
# Retraction below assumes a BOWDEN extruder (motor on the frame, PTFE tube to the hotend).
# If your D12 is direct drive (motor sits on the print head), use retract_length = 1 instead.
retract_length = 5
retract_speed = 40
deretract_speed = 30
retract_before_travel = 1
retract_layer_change = 1
retract_lift = 0
retract_restart_extra = 0
wipe = 1
avoid_crossing_perimeters = 1
# Skip retraction for travels that stay inside the part (ooze is hidden there); cuts retractions ~80% on this model
only_retract_when_crossing_perimeters = 1
gcode_label_objects = disabled
binary_gcode = 0
arc_fitting = disabled
gcode_comments = 0
autoemit_temperature_commands = 1
start_gcode = G90 ; absolute positioning\nM82 ; absolute extrusion\nM104 S150 ; pre-warm nozzle (no oozing yet)\nM190 S[first_layer_bed_temperature] ; heat bed and wait\nG28 ; home all axes (after bed heats, so expansion is accounted for)\n; G29 ; uncomment if your D12 has a bed-levelling sensor\nM109 S[first_layer_temperature] ; heat nozzle and wait\nG92 E0\nG1 Z5 F3000\nG1 X5 Y20 F5000 ; go to start of prime line\nG1 Z0.3 F3000\nG1 Y150 E12 F1500 ; prime line along the left edge\nG1 X5.4 Y150 F1500\nG1 Y20 E20 F1500 ; second prime line\nG92 E0\nG1 E-1 F2400 ; small retract before travel\nG1 Z2 F3000 ; lift before moving to the part\nG92 E0\n
end_gcode = M104 S0 ; nozzle off\nM140 S0 ; bed off\nG91 ; relative moves\nG1 E-2 F2700 ; retract\nG1 Z10 F3000 ; lift clear of the part\nG90 ; absolute moves\nG1 X0 Y220 F3000 ; present the part\nM106 S0 ; fan off\nM84 ; motors off\n
# --- filament (PLA) ---
filament_type = PLA
filament_diameter = 1.75
filament_density = 1.24
filament_colour = #29B2B2
# Calibrate this with a single-wall cube; most PLA lands between 0.94 and 1.0
extrusion_multiplier = 0.97
# Starting point - confirm with a temperature tower (190-215) for your specific spool
temperature = 190
# Hot first layer bonds hard to the bed - your original 222 worked, so it's back near that
first_layer_temperature = 190
bed_temperature = 50
first_layer_bed_temperature = 55
max_volumetric_speed = 11
cooling = 1
fan_always_on = 1
# ~70-75% on the plate layers (less shrink stress pulling the ends up), ramps to 100% on the fast U-channel layers
min_fan_speed = 50
max_fan_speed = 100
bridge_fan_speed = 100
# No fan for the first 3 layers, gentle ramp after, so the base stays warm and stuck down
disable_fan_first_layers = 3
full_fan_speed_layer = 6
fan_below_layer_time = 60
# U-channel layers take only ~8 s each; give the thin walls time to cool
slowdown_below_layer_time = 12
min_print_speed = 10
# --- print ---
# 0.16 / 0.20 are whole-step multiples for a standard T8 (8 mm lead) Z screw
layer_height = 0.13
# Back to your original 0.15 - your Z/bed level is tuned for this squish
first_layer_height = 0.13
perimeters = 3
top_solid_layers = 5
bottom_solid_layers = 4
top_solid_min_thickness = 0.8
bottom_solid_min_thickness = 0.6
fill_density = 10%
fill_pattern = grid
top_fill_pattern = monotonic
bottom_fill_pattern = monotonic
perimeter_generator = arachne
# Infill first: each layer then ends on perimeters, so the layer-change travel no longer jumps across the windows / U opening
infill_first = 1
thin_walls = 0
extra_perimeters = 0
ensure_vertical_shell_thickness = 1
seam_position = rear
support_material = 0
skirts = 1
skirt_distance = 6
skirt_height = 1
# Brim restored and widened - it anchors the plate ends against warping
brim_type = outer_only
brim_width = 5
brim_separation = 0
elefant_foot_compensation = 0.2
xy_size_compensation = 0
extrusion_width = 0.45
first_layer_extrusion_width = 0.45
perimeter_extrusion_width = 0.45
external_perimeter_extrusion_width = 0.45
infill_extrusion_width = 0.45
solid_infill_extrusion_width = 0.45
top_infill_extrusion_width = 0.4
perimeter_speed = 45
external_perimeter_speed = 25
small_perimeter_speed = 20
infill_speed = 60
solid_infill_speed = 45
top_solid_infill_speed = 30
gap_fill_speed = 20
bridge_speed = 25
# Slows the inward ledges of the stepped slot so they don't droop
enable_dynamic_overhang_speeds = 1
overhang_speed_0 = 15
overhang_speed_1 = 15
overhang_speed_2 = 20
overhang_speed_3 = 25
first_layer_speed = 20
travel_speed = 150
max_print_speed = 60
output_filename_format = [input_filename_base].gcode

