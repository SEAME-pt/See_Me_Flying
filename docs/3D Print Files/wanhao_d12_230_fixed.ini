# Wanhao Duplicator 12/230 - PLA - tuned for less stringing, cleaner layers, better precision
# --- printer ---
bed_shape = 0x0,230x0,230x230,0x230
max_print_height = 240
gcode_flavor = marlin2
machine_limits_usage = time_estimate_only
nozzle_diameter = 0.4
use_relative_e_distances = 0
use_firmware_retraction = 0
# Retraction below assumes a BOWDEN extruder (motor on the frame, PTFE tube to the hotend).
# If your D12 is direct drive (motor sits on the print head), use retract_length = 1 instead.
retract_length = 5
retract_speed = 40
deretract_speed = 30
retract_before_travel = 1
retract_layer_change = 1
retract_lift = 0
retract_restart_extra = 0
wipe = 1
avoid_crossing_perimeters = 1
gcode_label_objects = disabled
binary_gcode = 0
arc_fitting = disabled
gcode_comments = 0
autoemit_temperature_commands = 1
start_gcode = G90 ; absolute positioning\nM82 ; absolute extrusion\nM104 S150 ; pre-warm nozzle (no oozing yet)\nM190 S[first_layer_bed_temperature] ; heat bed and wait\nG28 ; home all axes (after bed heats, so expansion is accounted for)\n; G29 ; uncomment if your D12 has a bed-levelling sensor\nM109 S[first_layer_temperature] ; heat nozzle and wait\nG92 E0\nG1 Z5 F3000\nG1 X5 Y20 F5000 ; go to start of prime line\nG1 Z0.3 F3000\nG1 Y150 E12 F1500 ; prime line along the left edge\nG1 X5.4 Y150 F1500\nG1 Y20 E20 F1500 ; second prime line\nG92 E0\nG1 E-1 F2400 ; small retract before travel\nG1 Z2 F3000 ; lift before moving to the part\n
end_gcode = M104 S0 ; nozzle off\nM140 S0 ; bed off\nG91 ; relative moves\nG1 E-2 F2700 ; retract\nG1 Z10 F3000 ; lift clear of the part\nG90 ; absolute moves\nG1 X0 Y220 F3000 ; present the part\nM106 S0 ; fan off\nM84 ; motors off\n
# --- filament (PLA) ---
filament_type = PLA
filament_diameter = 1.75
filament_density = 1.24
filament_colour = #29B2B2
# Calibrate this with a single-wall cube; most PLA lands between 0.94 and 1.0
extrusion_multiplier = 0.97
# Starting point - confirm with a temperature tower (190-215) for your specific spool
temperature = 190
first_layer_temperature = 190
bed_temperature = 50
first_layer_bed_temperature = 50
max_volumetric_speed = 11
cooling = 1
fan_always_on = 1
min_fan_speed = 100
max_fan_speed = 100
bridge_fan_speed = 100
disable_fan_first_layers = 1
full_fan_speed_layer = 3
fan_below_layer_time = 60
slowdown_below_layer_time = 12
min_print_speed = 10
# --- print ---
layer_height = 0.12
first_layer_height = 0.16
perimeters = 3
top_solid_layers = 5
bottom_solid_layers = 4
top_solid_min_thickness = 0.8
bottom_solid_min_thickness = 0.6
fill_density = 25%
fill_pattern = gyroid
top_fill_pattern = monotonic
bottom_fill_pattern = monotonic
perimeter_generator = arachne
thin_walls = 0
extra_perimeters = 0
ensure_vertical_shell_thickness = 1
seam_position = rear
support_material = 0
skirts = 1
skirt_distance = 6
skirt_height = 1
brim_type = outer_only
brim_width = 3
brim_separation = 0
elefant_foot_compensation = 0.1
xy_size_compensation = 0
extrusion_width = 0.45
first_layer_extrusion_width = 0.5
perimeter_extrusion_width = 0.45
external_perimeter_extrusion_width = 0.45
infill_extrusion_width = 0.45
solid_infill_extrusion_width = 0.45
top_infill_extrusion_width = 0.4
perimeter_speed = 45
external_perimeter_speed = 25
small_perimeter_speed = 20
infill_speed = 60
solid_infill_speed = 45
top_solid_infill_speed = 30
gap_fill_speed = 20
bridge_speed = 25
first_layer_speed = 20
travel_speed = 150
max_print_speed = 60
default_acceleration = 1000
external_perimeter_acceleration = 500
perimeter_acceleration = 800
infill_acceleration = 1000
first_layer_acceleration = 500
output_filename_format = [input_filename_base].gcode

