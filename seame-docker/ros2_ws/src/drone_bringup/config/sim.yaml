fc_bridge:
  ros__parameters:
    rate_hz: 20.0
    setpoint_timeout_s: 0.3
    max_speed_xy: 0.5
    max_speed_z: 0.3
    max_yaw_rate: 1.0

watchdog:
  ros__parameters:
    timeout_s: 0.3          # keep equal to fc_bridge setpoint_timeout_s

setpoint_pub:
  ros__parameters:
    rate_hz: 10.0
    speed: 0.3
    takeoff_s: 4.0
    climb_speed: 0.3

mission:
  ros__parameters:
    rate_hz: 20.0
    target_h: 1.2          # m above the ground (fc/range); keep below range_max
    tolerance: 0.05
    kp_z: 1.0
    max_vz: 0.3            # = fc_bridge max_speed_z
    land_speed: 0.15
    ground_h: 0.12         # sim reads about 0.05 on the ground
    touchdown_s: 1.0
    hold_s: 3.0
    speed: 0.3
    omega: 0.5
    circle_laps: 1.0
    yaw_rate: 0.5
    yaw_turns: 1.0
    range_timeout_s: 0.5
    lost_hold_s: 2.0
    takeoff_timeout_s: 20.0
    start_delay_s: 2.0

joy_node:
  ros__parameters:
    device_name: "OpenTX Radiomaster Pocket Joystick"   # by name, not ID
    deadzone: 0.05
    autorepeat_rate: 20.0

radio_teleop:
  ros__parameters:
    axis_roll: 0
    axis_pitch: 1
    axis_throttle: 2
    axis_yaw: 3
    axis_arm: 4
    sign_roll: 1.0         # joy: right = -1, ROS wants right -> -y
    sign_pitch: -1.0       # joy: up = -1, ROS wants up -> +x
    sign_throttle: -1.0    # joy: up = -1, ROS wants up -> +z
    sign_yaw: 1.0          # joy: right = -1, ROS wants right -> negative yaw
    sign_arm: -1.0         # joy: armed = -1
    arm_threshold: 0.5
    arm_hold_s: 0.1        # debounce: SA bounces up to ~35 ms (arm_bounce.py, Oct 26)
    deadband: 0.08
    max_xy: 0.5
    max_z: 0.3
    max_yaw: 1.0